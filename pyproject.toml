[project]
name = "chatstrata"
version = "0.1.0"
description = "A personal, queryable archive of your AI conversations across providers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "chatstrata contributors" }]
keywords = ["llm", "chat", "archive", "duckdb", "claude", "chatgpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "duckdb>=1.0.0",
    "click>=8.1.0",
    "pydantic>=2.0",
    "platformdirs>=4.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
redact = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
chatstrata = "chatstrata.cli:cli"

[project.entry-points."chatstrata.sources"]
claude_code = "chatstrata.sources.claude_code.adapter:ClaudeCodeAdapter"
claude_export = "chatstrata.sources.claude_export.adapter:ClaudeExportAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatstrata"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "chatstrata"]
python_files = ["test_*.py"]
