[project]
name = "chatstrata"
version = "0.1.0"
description = "A personal, queryable archive of your AI conversations across providers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "chatstrata contributors" }]
keywords = ["llm", "chat", "archive", "duckdb", "claude", "chatgpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "duckdb>=1.0.0",
    "click>=8.1.0",
    "pydantic>=2.0",
    "platformdirs>=4.0",
    "pytz>=2024.1",
]

[project.urls]
Homepage = "https://github.com/brandonbosch/chatstrata"
Repository = "https://github.com/brandonbosch/chatstrata"
Issues = "https://github.com/brandonbosch/chatstrata/issues"
Documentation = "https://github.com/brandonbosch/chatstrata#readme"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]
redact = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]
mcp = [
    "mcp[cli]>=1.12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
chatstrata = "chatstrata.cli:cli"
chatstrata-mcp = "chatstrata.mcp.server:main"

[project.entry-points."chatstrata.sources"]
claude_code = "chatstrata.sources.claude_code.adapter:ClaudeCodeAdapter"
claude_export = "chatstrata.sources.claude_export.adapter:ClaudeExportAdapter"
codex_cli = "chatstrata.sources.codex_cli.adapter:CodexCliAdapter"
opencode = "chatstrata.sources.opencode.adapter:OpenCodeAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatstrata"]
exclude = [
    "chatstrata/**/tests",
]

[tool.hatch.build.targets.sdist]
include = [
    "/chatstrata",
    "/docs",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/pyproject.toml",
]
exclude = [
    "/.claude",
    "/.mcp.json",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/.zensical-venv",
    "/chatstrata/**/tests",
    "/docs-site/.cache",
    "/docs-site/site",
    "/tests",
    "*.duckdb",
    "*.duckdb.wal",
    ".DS_Store",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "chatstrata"]
python_files = ["test_*.py"]
