name: hermes_agent
display_name: Hermes Agent
version: "0.1.0"
schema_version: 1
description: |
  Ingests conversations from Hermes Agent's canonical session store: a SQLite
  database at $HERMES_HOME/state.db (default profile) and
  $HERMES_HOME/profiles/<name>/state.db (every named profile), where
  $HERMES_HOME falls back to ~/.hermes when unset. Sessions live in the
  `sessions` table; messages in `messages` with roles user/assistant/
  tool/system, assistant tool_calls as a JSON array, and tool results linked
  back via tool_call_id. Reasoning traces map to thinking blocks; compaction
  summaries are kept with a compressed_summary flag. Superseded (inactive,
  never-compacted) rows are skipped. The databases are opened read-only. A
  store that is missing, unreadable, or lacks a `sessions` table raises instead
  of reading as an empty source, so the CLI can report the path and the reason.
data_source: local_database
default_path: ~/.hermes/state.db
