name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "site/**"
      - ".github/workflows/docs.yml"
      - "scripts/install.sh"
      - "scripts/build-site.sh"
  pull_request:
    paths:
      - "docs-site/**"
      - "site/**"
      - ".github/workflows/docs.yml"
      - "scripts/install.sh"
      - "scripts/build-site.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check landing page JavaScript
        run: for file in site/*.mjs; do node --check "$file"; done

      - name: Build docs
        run: sh scripts/build-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    name: Deploy docs
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
