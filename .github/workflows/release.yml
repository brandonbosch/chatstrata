name: Release

# Go releases are tags starting with v2 (release candidates during M5,
# v2.0.0 at M6). Python releases are v0.x tags and go through publish.yml.
on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v2 tag to rebuild and (re)upload"
        required: true

permissions:
  contents: read

jobs:
  build:
    # DuckDB needs CGo, so each target builds on its own native runner.
    # Linux builds on the oldest supported runner for a lower glibc floor.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, arch: amd64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64 }
          - { runner: macos-latest, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch DuckDB's fts extension for this platform
        run: go run ./internal/tools/fetchfts
      - name: Test
        run: go test -tags fts_embed ./...
      - name: Build
        run: |
          go build -trimpath -tags fts_embed \
            -ldflags "-s -w -X github.com/brandonbosch/chatstrata/internal/cli.Version=${TAG#v}" \
            -o dist/chatstrata ./cmd/chatstrata
      - name: Smoke test
        run: scripts/smoke-release.sh dist/chatstrata
      - name: Package
        run: |
          name="chatstrata_${TAG#v}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir "$name"
          cp dist/chatstrata LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish the GitHub release
        run: |
          # Release candidates (v2.0.0-rc.1) are marked pre-release.
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* $pre --verify-tag --generate-notes \
              --title "chatstrata $TAG" --repo "$GITHUB_REPOSITORY"
          fi
