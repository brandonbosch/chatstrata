name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Release targets: DuckDB needs CGo, so each is built natively.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check
        run: ./scripts/check.sh

  full:
    # The same full gate a release hand-off runs: tidy, golangci-lint, and a
    # release build that loads DuckDB's embedded fts extension.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Full check
        run: ./scripts/check.sh --full
