name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run ruff
        run: uv run --extra dev python -m ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        extras: ["--extra dev", "--extra dev --extra redact"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} ${{ matrix.extras }} python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Check package metadata
        run: uvx twine check dist/*

  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Release targets: DuckDB needs CGo, so each is built natively.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o bin/chatstrata ./cmd/chatstrata && ./bin/chatstrata version
      - name: Release build (embedded fts extension)
        run: |
          go run ./internal/tools/fetchfts
          go test -tags fts_embed ./internal/store/ ./internal/cli/
          go build -tags fts_embed -o bin/chatstrata-release ./cmd/chatstrata
          scripts/smoke-release.sh bin/chatstrata-release
