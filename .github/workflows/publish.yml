name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to PyPI
    # Only the Python app's releases (v0.x). Go releases (v2.x) are built by
    # release.yml and never go to PyPI.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v0.')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
