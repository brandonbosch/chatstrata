[project]
site_name = "chatstrata"
site_description = "Your AI conversations, archived locally and queryable by your agents."
site_author = "Brandon Bosch"
site_url = "https://chatstrata.sprawlcommons.com/"
repo_url = "https://github.com/brandonbosch/chatstrata"
nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "Sources" = "sources.md" },
  { "Collection and recovery" = "ingestion.md" },
  { "Connect an agent" = "mcp.md" },
  { "Search and SQL" = "querying.md" },
  { "Schema" = "schema.md" },
  { "Privacy" = "privacy.md" },
  { "Legacy migration" = "migrations.md" },
  { "CLI reference" = "cli.md" },
  { "Add an adapter" = "adapters.md" },
]
[project.theme]
logo = "images/chatstrata.svg"
favicon = "images/chatstrata.svg"
features = ["content.code.copy", "navigation.sections", "navigation.footer", "search.highlight"]
[project.theme.font]
text = false
code = false
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.tables]
[project.markdown_extensions.fenced_code]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]
